{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2 style="margin-top:0;font-size:20px">Our terms have changed</h2>
  <p>Please read and accept the updated <a href="/terms" target="_blank" rel="noopener">Terms of Use &amp; Privacy Notice</a>
     (version {{ version }}) to keep using ARIA.</p>
  {% if summary %}<p style="font-size:14px;color:var(--muted)"><strong>What changed:</strong> {{ summary }}</p>{% endif %}
  <form method="post" action="/terms/accept">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="check" for="agree">
      <input id="agree" name="agree" type="checkbox" value="yes" required>
      <span>I have read and agree to the updated Terms of Use &amp; Privacy Notice.</span>
    </label>
    <button type="submit">Accept and continue</button>
  </form>
  <form method="post" action="/auth/logout">
    <button type="submit" style="background:transparent;color:var(--accent);border:1px solid var(--border)">Log out instead</button>
  </form>
  <p class="alt" style="font-size:13px">Don't agree? You can <a href="/account/delete">delete your account</a>.</p>
</div>
{% endblock %}
