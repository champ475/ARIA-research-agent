{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2 style="margin-top:0;font-size:20px">Create your account</h2>
  {% if error %}<div class="msg error" role="alert">{{ error }}</div>{% endif %}
  {% if notice %}<div class="msg ok" role="status">{{ notice }}</div>{% endif %}
  <form method="post" action="/signup" novalidate>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required value="{{ email or '' }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required
           aria-describedby="pw-hint">
    <div id="pw-hint" style="font-size:13px;color:var(--muted);margin-top:4px">At least 8 characters.</div>
    <label class="check" for="agree">
      <input id="agree" name="agree" type="checkbox" value="yes">
      <span>I have read and agree to the <a href="/terms" target="_blank" rel="noopener">Terms of Use &amp; Privacy Notice</a>.</span>
    </label>
    <button type="submit">Sign up</button>
  </form>
  <p class="alt">Already have an account? <a href="/login">Log in</a></p>
</div>
{% endblock %}
