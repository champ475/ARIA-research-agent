{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2 style="margin-top:0;font-size:20px">Confirm your email address</h2>
  {% if notice %}<div class="msg ok" role="status">{{ notice }}</div>{% endif %}
  <p>We sent a confirmation link to <strong>{{ email }}</strong>. Open it to start using ARIA.</p>
  <p style="font-size:14px;color:var(--muted)">Can't find it? Check your spam folder, or send a new link.</p>
  <form method="post" action="/auth/verify/resend">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit">Send a new link</button>
  </form>
  <form method="post" action="/auth/logout">
    <button type="submit" style="background:transparent;color:var(--accent);border:1px solid var(--border)">Log out</button>
  </form>
</div>
{% endblock %}
