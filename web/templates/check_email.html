{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2 style="margin-top:0;font-size:20px">Check your email</h2>
  <div class="msg ok" role="status">If <strong>{{ email }}</strong> can be used, we've sent it a link.</div>
  <p>Open the link in that email to confirm your address, then log in. It can take a minute to arrive —
     check your spam folder too.</p>
  <p class="alt"><a href="/login">Go to log in</a></p>
</div>
{% endblock %}
