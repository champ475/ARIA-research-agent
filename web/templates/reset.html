{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2 style="margin-top:0;font-size:20px">Choose a new password</h2>
  {% if error %}<div class="msg error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/auth/reset/{{ token | urlencode }}" novalidate>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="password">New password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    <label for="confirm">Repeat it</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    <button type="submit">Set password</button>
  </form>
  <p class="alt" style="font-size:13px">Every device signed in to this account will be logged out.</p>
</div>
{% endblock %}
