{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2 style="margin-top:0;font-size:20px">Reset your password</h2>
  {% if error %}<div class="msg error" role="alert">{{ error }}</div>{% endif %}
  {% if notice %}<div class="msg ok" role="status">{{ notice }}</div>{% endif %}
  {% if not sent %}
  <form method="post" action="/auth/forgot" novalidate>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <button type="submit">Email me a reset link</button>
  </form>
  {% endif %}
  <p class="alt"><a href="/login">Back to log in</a></p>
</div>
{% endblock %}
