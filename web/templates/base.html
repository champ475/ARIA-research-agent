<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · ARIA</title>
  <style>
    :root {
      --bg: #f6f8fa; --card: #ffffff; --text: #1f2328; --muted: #57606a;
      --border: #d0d7de; --accent: #0969da; --accent-text: #ffffff; --error-bg: #ffebe9; --error: #a40e26;
      --ok-bg: #dafbe1; --ok: #116329;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #9da7b3;
        --border: #30363d; --accent: #4493f8; --accent-text: #0d1117; --error-bg: #3c1618; --error: #ffa198;
        --ok-bg: #12261e; --ok: #7ee2a8;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 48px 16px; }
    main.wide { max-width: 760px; }
    .brand { text-align: center; margin-bottom: 24px; }
    .brand h1 { font-size: 26px; margin: 0; color: var(--accent); }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
    input[type=email], input[type=password], input[type=text] {
      width: 100%; padding: 10px 12px; font-size: 16px; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; font-size: 14px; font-weight: 400; }
    .check input { margin-top: 4px; width: 18px; height: 18px; }
    button { width: 100%; margin-top: 20px; padding: 11px; font-size: 16px; font-weight: 600; cursor: pointer;
             color: var(--accent-text); background: var(--accent); border: 0; border-radius: 8px; }
    .alt { text-align: center; margin-top: 18px; font-size: 14px; color: var(--muted); }
    a { color: var(--accent); }
    .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
    .msg.error { background: var(--error-bg); color: var(--error); }
    .msg.ok { background: var(--ok-bg); color: var(--ok); }
    .legal { font-size: 15px; }
    .legal h1, .legal h2 { font-size: 20px; }
  </style>
</head>
<body>
<main class="{{ main_class or '' }}">
  <div class="brand">
    <h1>⚡ ARIA</h1>
    <p>Research &amp; education for Indian markets — not investment advice</p>
  </div>
  {% block content %}{% endblock %}
</main>
</body>
</html>
