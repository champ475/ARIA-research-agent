[project]
name = "aria-investment-agent"
version = "2.0.0"
description = "Autonomous Research & Investment Analyst — multi-agent investment research platform for Indian equity markets (NSE/BSE)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# This is a Gradio app run via `python app.py`, not a library — skip
# package auto-discovery so `pip install .` doesn't try to scan
# tests/docs/scripts as installable packages.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres (TEST_DATABASE_URL or Docker); skipped otherwise",
]

# ── Quality gates (TEST-01) — CI runs exactly these; see .github/workflows/ci.yml ──
[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["venv", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20", "SIM"]
ignore = [
    "E501",   # long string literals/SQL/prompts; the formatter handles code layout
    "S110",   # try/except/pass: used deliberately where a best-effort side path must never fail a user turn
    "S112",   # try/except/continue: same rationale, per-item loops over external data
    "SIM108", # ternary rewrites hurt readability of the multi-line branches used here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "B011", "E741"]
"scripts/**" = ["T20", "E402"]       # CLI output; sys.path bootstrap before imports
"app.py" = ["E402"]                  # configure_logging() must run before modules that log at import

[tool.ruff.lint.isort]
known-first-party = ["agents", "graph", "tools", "utils", "config", "app", "scripts", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["graph", "utils", "agents"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Ratchet toward the PRD's --strict: modules listed here are the next ones to
# fully annotate; remove an entry once it passes under the global settings.

[tool.coverage.run]
source = ["agents", "graph", "tools", "utils"]
branch = true

[tool.coverage.report]
# Ratchet: set to the measured baseline (rounded down); raise it as tests are
# added. PRD target is 85.
fail_under = 0
show_missing = false
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", "venv", "scripts/load_test.py"]
# B101 assert: only in tests (excluded). B608 SQL: the one dynamic SQL string
# interpolates a constant fragment, never user input (scripts/check_alerts.py).
skips = ["B101"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
