# Mirrors the CI quality gates (PRD TEST-01). Install once, with the venv's Python:
#   .\venv\Scripts\python.exe -m pre_commit install      (Windows)
#   ./venv/bin/python -m pre_commit install              (macOS/Linux)
# Check everything:  <same python> -m pre_commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Not on bytes that must stay as written: prompt files (their hash keys the
      # recorded eval fixtures), recorded/fake HTTP data, vendored JS, eval
      # results and generated drill records.
      - id: trailing-whitespace
        exclude: &verbatim ^(prompts/|data/|tests/fixtures/|tests/e2e/vendor/|evals/(baseline\.json|fixtures/|results/)|docs/drills/)
      - id: end-of-file-fixer
        exclude: *verbatim
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      # The project venv's mypy (scripts/in_venv.py): the pydantic plugin needs the
      # project's packages, and a bare `mypy` may be a global install.
      - id: mypy
        name: mypy
        entry: python scripts/in_venv.py mypy
        language: python
        pass_filenames: false
        types: [python]
      # Same scope and config as CI's security job.
      - id: bandit
        name: bandit
        entry: python scripts/in_venv.py bandit -c pyproject.toml -r agents graph tools utils web app.py server.py scripts -q
        language: python
        pass_filenames: false
        types: [python]
