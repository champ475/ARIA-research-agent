services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aria
      POSTGRES_PASSWORD: aria
      POSTGRES_DB: aria
    volumes:
      - aria_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aria"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      # Overrides .env's DATABASE_URL so the app always talks to the
      # bundled `db` service when run via compose, regardless of what's
      # in .env (e.g. a Neon URL left over from non-Docker use).
      DATABASE_URL: postgresql://aria:aria@db:5432/aria
    depends_on:
      db:
        condition: service_healthy

volumes:
  aria_pg_data:
