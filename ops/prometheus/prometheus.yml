# OBS-03: scrapes the app's /metrics (compose `observability` profile).
# Outside dev/test the app needs METRICS_TOKEN; put the same value in
# ops/prometheus/metrics_token and uncomment `authorization` below.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aria-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:7860"]
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/metrics_token
