# Release pipeline (PRD TEST-07). A `vX.Y.Z` tag builds one image, proves
# that exact image works (Playwright smoke journeys + golden-set eval against
# the image itself, offline: fake LLM and recorded data), then promotes it by
# retagging `:stable`. Rolling back = retagging `:stable` to the previous
# version (scripts/rollback.sh). See docs/RELEASING.md.
#
# Deploy is a no-op hook: ARIA isn't hosted (OPS-03, owner's decision). A
# host would pull `:stable` in the `deploy` step.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to (re)release, e.g. v2.1.0"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}
      - id: name
        # GHCR names must be lower case.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ env.VERSION }}
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  verify:
    # The smoke journeys run against the pushed image (by digest), not a rebuild.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      ARIA_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
      E2E: "1"
      E2E_BASE_URL: http://localhost:7870
      E2E_DATABASE_URL: postgresql://aria:aria@localhost:55433/aria_e2e
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: start the image with the offline test stack
        run: docker compose -f compose.test.yml up -d --no-build --wait --wait-timeout 180
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - name: smoke journeys
        run: >-
          python -m pytest tests/e2e/test_journeys.py -q -p no:cacheprovider
          -k "signup or equity or screener or alert or portfolio"
          --tracing retain-on-failure --output test-results
      - name: golden-set eval (LLM-01)
        run: python evals/runner.py --replay --compare evals/baseline.json
      - if: failure()
        run: docker compose -f compose.test.yml logs --no-color > test-results/compose.log 2>&1 || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-${{ env.VERSION }}
          path: test-results/
          retention-days: 14
      - if: always()
        run: docker compose -f compose.test.yml down -v

  promote:
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A protected environment lets the owner require an approval before promotion.
    environment: release
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: retag :stable to the verified digest
        run: >-
          docker buildx imagetools create
          -t "${{ needs.build.outputs.image }}:stable"
          "${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}"
      - name: deploy (no-op hook)
        run: |
          echo "ARIA is not hosted (OPS-03): nothing to deploy."
          echo "A host would now pull ${{ needs.build.outputs.image }}:stable, run scripts/migrate.py, then restart app and worker."
