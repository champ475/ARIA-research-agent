name: CI

# Quality gates (PRD TEST-01). Every job must pass before merging to main.
# Run the same checks locally with:  pip install -r requirements-dev.txt && pre-commit run --all-files
#   ruff check . && ruff format --check . && mypy && pytest --cov
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install "ruff==0.17.0"
      - run: ruff check . --output-format=github
      - run: ruff format --check .
      - name: no unused or undeclared dependencies, no dead code (ARCH-07)
        run: pip install "deptry==0.25.1" "vulture==2.16" -r requirements.txt && deptry . && vulture
      - name: layering - ui calls services, never the database or data tools (ARCH-02)
        run: pip install "import-linter==2.15" -r requirements.txt && lint-imports
      - name: lock files match requirements*.txt (SEC-14)
        run: pip install "uv==0.12.23" && python scripts/lock.py --check

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aria
          POSTGRES_PASSWORD: aria
          POSTGRES_DB: aria_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aria" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Integration tests (tests/integration) run against this throwaway DB.
      TEST_DATABASE_URL: postgresql://aria:aria@localhost:5432/aria_test
      SECRET_KEY: ci-only-not-a-secret
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # Pango for WeasyPrint, so the real-render PDF security test (SEC-02) runs.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: python -m pytest tests/ -q --cov --cov-report=term --cov-report=xml

  e2e:
    # TEST-04: the 15 user journeys in headless Chromium against a real server
    # (fake LLM + offline data, throwaway database). Traces of failures are
    # kept as an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aria
          POSTGRES_PASSWORD: aria
          POSTGRES_DB: aria_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aria" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://aria:aria@localhost:5432/aria_test
      E2E: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/e2e -q -p no:cacheprovider --tracing retain-on-failure --output test-results
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

  eval:
    # Golden-set evaluation (PRD LLM-01): replays recorded LLM responses —
    # deterministic, no network, no API keys. Fails if any metric drops more
    # than 2 points below evals/baseline.json; on a PR, posts the diff.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - name: Golden-set eval (replay)
        id: eval
        run: python evals/runner.py --replay --compare evals/baseline.json --out evals/results/${{ github.sha }}.json --markdown eval.md
      - name: Comment the eval diff on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('eval.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file eval.md --edit-last || gh pr comment ${{ github.event.pull_request.number }} --body-file eval.md

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans the full history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install "bandit[toml]>=1.7.9" "pip-audit>=2.7.0"
      - name: bandit (static security scan)
        run: bandit -c pyproject.toml -r agents graph tools utils web services ui loadtests app.py server.py worker.py scripts -q
      - name: pip-audit (known-vulnerable dependencies)
        run: pip-audit -r requirements-dev.lock --disable-pip --require-hashes --progress-spinner off
      - name: gitleaks (committed secrets)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    # Hardened container (PRD SEC-14): builds from the hashed lock, scans the
    # image with Trivy (fails on fixable HIGH/CRITICAL) and proves it does not
    # run as root.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: aria:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: runs as non-root
        run: test "$(docker run --rm --entrypoint id aria:ci -u)" != "0"
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: aria:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
