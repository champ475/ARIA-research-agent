name: Alert Check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min, UTC — market-hours gating happens inside the script
  workflow_dispatch: {}       # manual "run once now" button, for testing

# Never let two checker runs overlap: a slow run plus the next cron tick could
# otherwise evaluate and deliver the same alert twice (DATA-08).
concurrency:
  group: alert-check
  cancel-in-progress: false

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-alerts.lock
      # REL-05: only what the checker imports (requirements-alerts.txt), hashed.
      - run: pip install --require-hashes -r requirements-alerts.lock
      # Takes the same `alert_check` advisory lock as worker.py and writes its
      # heartbeat, so a running worker and this cron never double-deliver.
      - run: python scripts/check_alerts.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Direct (non-pooler) host for the advisory lock; falls back to DATABASE_URL.
          JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          APP_ENV: prod
